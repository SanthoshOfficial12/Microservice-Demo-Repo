parameters:
  - name: Deploy_to_DEV
    type: boolean
    default: false
  - name: Deploy_to_QA
    type: boolean
    default: false
  - name: Deploy_to_UAT
    type: boolean
    default: false
  - name: Deploy_to_OPS
    type: boolean
    default: false
  - name: Deploy_to_PREPROD
    type: boolean
    default: false
  - name: Deploy_to_PROD
    type: boolean
    default: false
  - name: QA_Package_version
    type: string
    default: '*'
  - name: UAT_Package_version
    type: string
    default: '*'
  - name: OPS_Package_version
    type: string
    default: '*'
  - name: PREPROD_Package_version
    type: string
    default: '*'
  - name: PROD_Package_version
    type: string
    default: '*'
  - name: Prod_Source_Feed
    type: string
    default: 'UAT'
    values:
    - UAT
    - OPS

trigger:
  - none

variables:
  - name: containerRegistry
    value: devacr
  - name: repository
    value: command
  - name: Dockerfile
    value: Command/API/Dockerfile
  - name: buildContext
    value: .
  - name: vstsFeedPackagePublish
    value: command
  - name: codebase
    value: Command
  - template: Kubernetes-Deployments/CommonVariables/variables.yaml@cicd

resources:
  repositories:
  - repository: cicd
    type: github
    name: SanthoshOfficial12/Devops-yaml-scripts
    ref: refs/heads/main
    endpoint: serviceconnection

extends:
  template: Kubernetes-Deployments/microservice.yaml@cicd
  parameters:
    Deploy_to_DEV: ${{ parameters.Deploy_to_DEV }}
    Deploy_to_QA: ${{ parameters.Deploy_to_QA }}
    Deploy_to_UAT: ${{ parameters.Deploy_to_UAT }}
    Deploy_to_OPS: ${{ parameters.Deploy_to_OPS }}
    Deploy_to_PREPROD: ${{ parameters.Deploy_to_PREPROD }}
    Deploy_to_PROD: ${{ parameters.Deploy_to_PROD }}
    QA_Package_version: ${{ parameters.QA_Package_version }}
    UAT_Package_version: ${{ parameters.UAT_Package_version }}
    PROD_Package_version: ${{ parameters.PROD_Package_version }}
    PREPROD_Package_version: ${{ parameters.PREPROD_Package_version }}
    OPS_Package_version: ${{ parameters.OPS_Package_version }}
    Prod_Source_Feed: ${{ parameters.Prod_Source_Feed }}
